<svg data-c4-master="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="C4 连续翻滚，每次腾空震动并闪亮指示灯" style="width:100%;height:100%;color:var(--c4-accent,#ff970f)">
            <style>
              @keyframes c4-hop-v2{0%,3%,100%{transform:translateY(0)}10%,16%{transform:translateY(-10px)}22%,26%{transform:translateY(4.8px)}40%,52%{transform:translateY(-13px)}65%,69%{transform:translateY(2.2px)}77%,83%{transform:translateY(-10px)}91%,95%{transform:translateY(0)}97%{transform:translateY(-.35px)}}
              @keyframes c4-roll-v2{0%,3%{transform:rotate(0deg)}10%,16%{transform:rotate(45deg)}22%,26%{transform:rotate(90deg)}40%,52%{transform:rotate(180deg)}65%,69%{transform:rotate(270deg)}77%,83%{transform:rotate(315deg)}91%,100%{transform:rotate(360deg)}}
              @keyframes c4-shake-v2{0%,10%,16%,40%,52%,77%,83%,100%{transform:translateX(0) rotate(0deg)}11%,42%,78%{transform:translateX(-.9px) rotate(-4deg)}12%,44%,79%{transform:translateX(.9px) rotate(4deg)}13%,46%,80%{transform:translateX(-.7px) rotate(-3deg)}14%,48%,81%{transform:translateX(.5px) rotate(2deg)}15%,50%,82%{transform:translateX(-.25px) rotate(-1deg)}}
              @keyframes c4-shadow-v2{0%,3%,22%,26%,65%,69%,91%,100%{transform:scaleX(1);opacity:.25}10%,16%,77%,83%{transform:scaleX(.65);opacity:.12}40%,52%{transform:scaleX(.55);opacity:.1}}
              @keyframes c4-led-v2{0%,10%,17%,40%,53%,77%,84%,100%{opacity:.25}11%,15%,42%,50%,78%,82%{opacity:1}}
              @keyframes c4-signal-v2{0%,10%,17%,40%,53%,77%,84%,100%{opacity:0}11%,15%,42%,50%,78%,82%{opacity:.8}}
              .c4-hop-v2{transform-origin:32px 50px;animation:c4-hop-v2 var(--c4-hop,3.6s) cubic-bezier(.4,0,.35,1) infinite}
              .c4-rotation-v2{transform-origin:32px 33px;animation:c4-roll-v2 var(--c4-hop,3.6s) cubic-bezier(.4,0,.35,1) infinite}
              .c4-shake-v2{transform-origin:32px 33px;animation:c4-shake-v2 var(--c4-hop,3.6s) linear infinite}
              .c4-shadow-v2{transform-origin:32px 50.5px;animation:c4-shadow-v2 var(--c4-hop,3.6s) cubic-bezier(.4,0,.35,1) infinite}
              .c4-led-v2{animation:c4-led-v2 var(--c4-hop,3.6s) linear infinite}
              .c4-signal-v2{animation:c4-signal-v2 var(--c4-hop,3.6s) linear infinite}
              @media(prefers-reduced-motion:reduce){.c4-hop-v2,.c4-rotation-v2,.c4-shake-v2,.c4-shadow-v2,.c4-led-v2,.c4-signal-v2{animation:none}.c4-signal-v2{opacity:0}.c4-shadow-v2{opacity:.2}}
            </style>
