      </g>
      <g mask="url(#te-reveal)">
       <circle cx="32" cy="32" r="24.8" fill="#332a1e"/>
       <circle cx="32" cy="31" r="24" fill="#4a3c27" stroke="#b99d66" stroke-width="1.2"/>
       <circle cx="32" cy="31" r="21.6" stroke="#786442" stroke-width=".65"/>
       <g class="te-t-symbol">
        <path d="m32 12.2 3.2 8.6 9.1.4-7.1 5.8 2.3 8.8-7.5-5.1-7.5 5.1 2.3-8.8-7.1-5.8 9.1-.4Z" fill="#d9b979" stroke="#80613b" stroke-width=".7"/>
