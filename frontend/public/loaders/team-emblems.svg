<svg data-team-master="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="蓝色双翼拆弹钳徽记与金色星形双刀徽记，以柔和斜向扫光交替，并轻微缩放回弹" style="width:100%;height:100%">
     <defs>
      <linearGradient id="te-feather"><stop offset="0" stop-color="white"/><stop offset=".45" stop-color="white"/><stop offset=".55" stop-color="black"/><stop offset="1" stop-color="black"/></linearGradient>
      <mask id="te-reveal" x="-32" y="-32" width="128" height="128" maskUnits="userSpaceOnUse" style="mask-type:luminance"><g transform="rotate(-24 32 32)"><rect class="te-wipe" x="-96" y="-64" width="256" height="192" fill="url(#te-feather)"/></g></mask>
      <clipPath id="te-disc-clip"><circle cx="32" cy="31" r="24"/></clipPath>
      <linearGradient id="te-light"><stop stop-color="#f6dfad" stop-opacity="0"/><stop offset=".5" stop-color="#fff4d4" stop-opacity=".28"/><stop offset="1" stop-color="#f6dfad" stop-opacity="0"/></linearGradient>
     </defs>
     <style>
      @keyframes te-wipe{0%,27%{transform:translateX(-85px)}47%,77%{transform:translateX(85px)}97%,100%{transform:translateX(-85px)}}
      @keyframes te-badge{0%,24%,50%,74%,100%{transform:translate(0,0) rotate(0deg) scale(1)}29%{transform:translate(-1.2px,1.8px) rotate(-12deg) scale(.94)}36%{transform:translate(1.4px,-2.6px) rotate(10deg) scale(.98)}43%{transform:translate(-.5px,-.5px) rotate(-3.5deg) scale(1.045)}49%{transform:translate(0,0) rotate(0deg) scale(1)}79%{transform:translate(1.2px,1.8px) rotate(12deg) scale(.94)}86%{transform:translate(-1.4px,-2.6px) rotate(-10deg) scale(.98)}93%{transform:translate(.5px,-.5px) rotate(3.5deg) scale(1.045)}}
      @keyframes te-light{0%,27%{transform:translateX(-72px);opacity:0}30%{opacity:1}45%{transform:translateX(72px);opacity:0}77%{transform:translateX(72px);opacity:0}80%{opacity:1}95%,100%{transform:translateX(-72px);opacity:0}}
      @keyframes te-ct-symbol{0%,24%,100%{transform:scale(1)}33%{transform:scale(.93)}45%,75%{transform:scale(.97)}88%{transform:scale(1.04)}96%{transform:scale(1)}}
      @keyframes te-t-symbol{0%,25%{transform:scale(.96)}38%{transform:scale(1.04)}47%,74%{transform:scale(1)}83%{transform:scale(.93)}95%,100%{transform:scale(.96)}}
      @keyframes te-shadow{0%,24%,50%,74%,100%{opacity:.2;transform:scaleX(1)}35%,85%{opacity:.12;transform:scaleX(.9)}}
      .te-wipe{animation:te-wipe var(--te-cycle,4.8s) cubic-bezier(.4,0,.2,1) infinite}
      .te-badge{transform-origin:32px 31px;animation:te-badge var(--te-cycle,4.8s) ease-in-out infinite}
      .te-light{animation:te-light var(--te-cycle,4.8s) cubic-bezier(.4,0,.2,1) infinite}
      .te-ct-symbol,.te-t-symbol{transform-origin:32px 31px;animation:te-ct-symbol var(--te-cycle,4.8s) ease-in-out infinite}
      .te-t-symbol{animation-name:te-t-symbol}
      .te-shadow{transform-origin:32px 58px;animation:te-shadow var(--te-cycle,4.8s) ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){.te-wipe,.te-badge,.te-light,.te-ct-symbol,.te-t-symbol,.te-shadow{animation:none}.te-wipe{transform:translateX(-85px)}.te-light{opacity:0}.te-shadow{opacity:.2}}
     </style>
     <ellipse class="te-shadow" cx="32" cy="58" rx="17" ry="1.6" fill="#000"/>
