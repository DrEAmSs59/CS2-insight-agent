       </g>
      </g>
      <g clip-path="url(#te-disc-clip)"><g transform="rotate(-24 32 32)"><rect class="te-light" x="23" y="-5" width="18" height="74" fill="url(#te-light)"/></g></g>
     </g>
    </svg>