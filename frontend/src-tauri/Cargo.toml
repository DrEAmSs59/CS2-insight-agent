[package]
name = "cs2-insight-agent-desktop"
version = "2.6.0"
description = "Lightweight Windows desktop shell for CS2 Insight Agent"
authors = ["CS2 Insight Agent contributors"]
edition = "2021"

[lib]
name = "cs2_insight_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
