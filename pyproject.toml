[project]
name = "cs2-insight-agent-backend"
version = "2.6.0"
description = "Python backend runtime for CS2 Insight Agent"
requires-python = ">=3.12.15,<3.13"
dependencies = [
    "certifi==2026.10.19",
    "aiosqlite==0.22.1",
    "cramjam==2.14.0",
    "lz4==4.4.5",
    "cryptography==50.0.2",
    "demoparser2==0.41.4+cs2insight10; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "fastapi==0.157.0",
    "httpx==0.28.1",
    "obs-websocket-py==1.0",
    "openai==3.35.1",
    "packaging==26.3",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "python-dateutil==2.9.0.post0",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
    "watchdog==6.0.0",
    "websockets==17.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
parser-build = [
    "maturin==1.15.0",
]

[tool.uv]
package = false
required-version = ">=0.13.5,<0.14"

[tool.uv.sources]
demoparser2 = { url = "https://github.com/DrEAmSs59/CS2-insight-agent/releases/download/demoparser-runtime-v0.41.4-cs2insight10-r1/demoparser2-0.41.4%2Bcs2insight10-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }
