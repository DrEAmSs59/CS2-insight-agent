[project]
name = "cs2-insight-agent-backend"
version = "2.6.0"
description = "Python backend runtime for CS2 Insight Agent"
requires-python = "==3.12.*"
dependencies = [
    "aiosqlite==0.22.1",
    "cramjam==2.11.0",
    "cryptography==50.0.0",
    "demoparser2==0.41.4+cs2insight8; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "obs-websocket-py==1.0",
    "openai==2.41.0",
    "packaging==26.2",
    "pillow==12.2.0",
    "pydantic==2.13.4",
    "python-dateutil==2.9.0.post0",
    "python-multipart==0.0.30",
    "uvicorn==0.49.0",
    "watchdog==6.0.0",
    "websockets==16.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]
parser-build = [
    "maturin==1.14.1",
]

[tool.uv]
package = false
required-version = ">=0.11.8,<0.12"

[tool.uv.sources]
demoparser2 = { url = "https://github.com/DrEAmSs59/CS2-insight-agent/releases/download/demoparser-runtime-v0.41.4-cs2insight8-r1/demoparser2-0.41.4%2Bcs2insight8-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }
