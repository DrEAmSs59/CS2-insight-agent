<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #kb {
    position: fixed;
    display: flex;
    gap: 14px;
    align-items: flex-end;
    opacity: .92;
    font-family: Consolas, monospace;
  }
  #kb.pos-bottom-center {
    left: 50%;
    bottom: 14vh;
    transform: translateX(-50%) scale(1.3);
    transform-origin: bottom center;
  }
  #kb.pos-minimap-below {
    left: 5vh;
    bottom: 48vh;
    transform: scale(1.3);
    transform-origin: top left;
  }
  #kb.pos-weapon-right {
    right: 5vh;
    bottom: 48vh;
    transform: scale(1.3);
    transform-origin: bottom right;
  }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 6px; justify-content: center; }
  .key {
    height: 40px;
    border-radius: 6px;
    background: #2A2D34;
    border: 1px solid #3F434D;
    color: #8A8F99;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .04s, color .04s, box-shadow .04s;
  }
  .key.on {
    background: #E8B23A;
    color: #1A1A1A;
    border-color: #F5C85A;
    box-shadow: 0 0 7px rgba(232,178,58,.55);
  }
  .k44 { width: 40px; }
  .kw  { width: 144px; }
  .mouse {
    width: 60px;
    height: 92px;
    border: 1px solid #3F434D;
    border-radius: 30px 30px 14px 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #23262d;
  }
  .mtop { display: flex; height: 46px; border-bottom: 1px solid #3F434D; }
  .mbtn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #8A8F99;
  }
  .mbtn.lb { border-right: 1px solid #3F434D; }
  .mbtn.on { background: #E8B23A; color: #1A1A1A; box-shadow: inset 0 0 8px rgba(232,178,58,.5); }
  .mbody { flex: 1; background: #2A2D34; }
  #kb.hidden { display: none; }
  /* 时序校准标记：只在录制诊断时出现，生产录制里 load 不带 calibration_ticks 就不显示。
     不透明黑底是关键——叠加层平时压在运动的游戏画面上，"这块区域什么时候变了"根本
     测不出叠加层；铺一块挡住背景的底之后，该区域在闪白之前是严格静止的，成片里第一
     次跳变必然来自这个标记本身。因此绝不能加 transition，任何过渡都会把跳变抹平。 */
  #cal {
    position: fixed;
    left: 0;
    top: 0;
    width: 160px;
    height: 160px;
    background: #000;
    display: none;
  }
  #cal.active { display: block; }
  #cal.lit { background: #fff; }
</style>
</head>
<body>
<div id="kb" class="hidden">
  <div class="col">
    <div class="row">
      <div class="key k44" data-k="W">W</div>
    </div>
    <div class="row">
      <div class="key k44" data-k="A">A</div>
      <div class="key k44" data-k="S">S</div>
      <div class="key k44" data-k="D">D</div>
    </div>
    <div class="row">
      <div class="key kw" data-k="jump">JUMP</div>
    </div>
    <div class="row">
      <div class="key k44" data-k="crouch">CTRL</div>
      <div class="key k44" data-k="walk">SHIFT</div>
      <div class="key k44" data-k="reload">R</div>
    </div>
  </div>
  <div class="mouse">
    <div class="mtop">
      <div class="mbtn lb" data-k="fire">L</div>
      <div class="mbtn rb" data-k="scope">R</div>
    </div>
    <div class="mbody"></div>
  </div>
</div>
<div id="cal"></div>

<script>
const PORT = location.port || "19871";
const SESSION_TOKEN = new URLSearchParams(location.hash.slice(1)).get("session") || "";
const els = {};
document.querySelectorAll("[data-k]").forEach(e => els[e.dataset.k] = e);
const kb = document.getElementById("kb");

const _pos = new URLSearchParams(location.search).get("pos") || "bottom_center";
const _posClass = { minimap_below: "pos-minimap-below", weapon_right: "pos-weapon-right" }[_pos] ?? "pos-bottom-center";
kb.classList.add(_posClass);

let track = [], tickRate = 64, startTick = 0, offset = 0;
let byTick = new Map(), tickList = [];
let running = false, resumeAt = 0, activeMs = 0;

// 时序校准：闪白必须撑够几帧才能在成片里被逐帧差分认出来，60fps 下 100ms 是 6 帧；
// 相邻校准 tick 需要间隔 1 秒以上，否则同一帧跨过两个 tick 只会闪一次。
const CAL_FLASH_MS = 100;
const cal = document.getElementById("cal");
let calTicks = [], calCursor = 0, calFlashUntil = 0;

function loadCalibration(ticks) {
  calTicks = (ticks || []).map(Number).filter(t => Number.isFinite(t)).sort((a, b) => a - b);
  calCursor = 0;
  calFlashUntil = 0;
  cal.classList.remove("lit");
  cal.classList.toggle("active", calTicks.length > 0);
}

function renderCalibration(tick, now) {
  // running 之前不闪：load 时会先 render(startTick) 一次，那时 demo 还没恢复播放，
  // 提前闪一下会毁掉成片开头那段静止的噪声底。
  if (!calTicks.length || !running) return;
  while (calCursor < calTicks.length && tick >= calTicks[calCursor]) {
    calFlashUntil = now + CAL_FLASH_MS;
    calCursor += 1;
  }
  cal.classList.toggle("lit", calFlashUntil > now);
}
// 新版 demo 的 weapon_fire 是逐发事件：自动步枪按住左键时，相邻子弹间
// 不能闪灭。右键也需要比单帧更长的可见时间，便于成片观看。
const STICKY_KEYS = new Set(["jump", "fire", "scope"]);
const STICKY_MS = {
  jump: 75,
  fire: 160,
  scope: 180,
};
const stickyUntil = {};

function loadTrack(msg) {
  track = msg.frames || [];
  tickRate = msg.tick_rate || 64;
  startTick = msg.start_tick || 0;
  offset = msg.offset_ticks || 0;
  byTick = new Map(track.map(f => [f.tick, f]));
  tickList = track.map(f => f.tick);
  activeMs = 0;
  running = false;
  for (const k in stickyUntil) delete stickyUntil[k];
  // 校准标记与按键轨道无关：只录 KillFX 时 frames 是空的，标记仍然要工作。
  loadCalibration(msg.calibration_ticks);
  // 仅击杀特效启用时 load 会携带空 frames：保持键盘隐藏，避免遗留源显示空骨架
  if (!track.length) { kb.classList.add("hidden"); return; }
  kb.classList.remove("hidden");
  render(startTick);
}

function nearest(tick) {
  if (byTick.has(tick)) return byTick.get(tick);
  if (!tickList.length) return null;
  let lo = 0, hi = tickList.length - 1;
  if (tick <= tickList[0]) return track[0];
  if (tick >= tickList[hi]) return track[hi];
  // floor：取不晚于当前 tick 的最近采样，避免「提前亮键」
  while (lo < hi) {
    const m = (lo + hi + 1) >> 1;
    if (tickList[m] <= tick) lo = m; else hi = m - 1;
  }
  return track[lo];
}

function render(tick) {
  const f = nearest(tick) || {};
  const now = performance.now();
  // 与按键同一次 rAF 里落地：校准标记量到的延迟就是按键本身走的那条路径。
  renderCalibration(tick, now);
  for (const k in els) {
    if (f[k] && STICKY_KEYS.has(k)) {
      const stickyMs = Math.max(STICKY_MS[k] ?? 45, (1000 / tickRate) * 3);
      stickyUntil[k] = now + stickyMs;
    }
    const on = !!f[k] || (STICKY_KEYS.has(k) && (stickyUntil[k] || 0) > now);
    els[k].classList.toggle("on", on);
  }
}

function loop() {
  if (running) {
    const elapsedMs = activeMs + (performance.now() - resumeAt);
    render(startTick + offset + Math.round(elapsedMs / 1000 * tickRate));
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function connect() {
  const wsUrl = `ws://127.0.0.1:${PORT}/ws/kb-overlay`;
  const ws = SESSION_TOKEN
    ? new WebSocket(wsUrl, ["cs2-insight", SESSION_TOKEN])
    : new WebSocket(wsUrl);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "load") {
      loadTrack(m);
    } else if (m.type === "resume") {
      // elapsed_ms 由服务端在晚连接时注入，用于同步当前播放位置
      if (typeof m.elapsed_ms === "number") activeMs = m.elapsed_ms;
      resumeAt = performance.now();
      running = true;
    } else if (m.type === "pause") {
      if (running) { activeMs += performance.now() - resumeAt; running = false; }
    } else if (m.type === "end") {
      running = false; activeMs = 0; kb.classList.add("hidden");
      // 不清掉的话，这块不透明黑底会留到下一次录制里。
      loadCalibration([]);
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
</body>
</html>
